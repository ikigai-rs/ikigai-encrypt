[package]
name = "ikigai-encrypt"
version = "0.3.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Public-key encryption module for ikigai — the dual of ikigai-sign. `urn:encrypt:encrypt` (open) seals bytes to one or more recipient public keys (age / X25519); `urn:encrypt:decrypt` (requires `urn:cap:decrypt`) opens them with a kernel-resolved identity. Keys are age recipients/identities resolved through the kernel — no keygen here (that is the secret module's job). Multi-recipient so an inbox can be encrypted to all of an owner's devices at once."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-encrypt"
homepage = "https://github.com/ikigai-rs/ikigai-encrypt"
keywords = ["ikigai", "roc", "encryption", "age", "x25519"]
categories = ["cryptography"]

[features]
# The kernel endpoints (`space()`, `Encrypt`, `Decrypt`). A library consumer that only
# seals and opens (ikigai-layers' state at rest, ledger #2016) turns the defaults off and
# links neither `ikigai-core` nor `async-trait`; CI's `no default features` job checks that.
default = ["endpoints"]
endpoints = ["armor", "dep:ikigai-core", "dep:async-trait", "dep:futures", "age/async"]
# ASCII armor: `age::seal_armored`, and armored input to `age::open`. The endpoints need it
# (they answer armored text); a binary-only consumer does not.
armor = ["age/armor"]

[dependencies]
# The published kernel, consumed from crates.io — the SAME version the hosts use. 0.2.0 is
# the streams release (ledger #2261); the old "0.1.89" pin meant <0.2.0 under 0.x rules, so
# this is a deliberate move, and core's types are in this crate's API (hence 0.3.0).
# 0.2.4 supplies reads_body so the kernel leaves streamed inputs for the endpoints.
ikigai-core = { version = "0.2.4", optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"], optional = true }

# The `age` file-encryption format (X25519 recipients, ChaCha20-Poly1305, ASCII armor).
# Well-audited, self-describing ciphertext, and NATIVE multi-recipient — so the encrypted
# inbox can name every one of the owner's device keys and any of them decrypts. Its `armor`
# feature (the ASCII-armored output that travels cleanly as an RDF/text literal) is this
# crate's `armor` feature, above. No keygen feature: this module never mints keys (the
# secret module does); `Identity::generate` is age's core API, not a feature.
age = { version = "0.11", default-features = false }

# The low-order recipient check (ledger #853, bug 1). Both are already in the graph
# through `age`, at the versions `age` 0.11 asks for, so nothing new is compiled. The
# check decodes the recipient exactly as age does (bech32 0.9, the Bech32 variant, HRP
# `age`) and runs the same X25519 function age runs, so the two cannot disagree about
# which points are low order. `x25519-dalek` 2.0.1 is the verified floor for
# `SharedSecret::was_contributory`; `static_secrets` gives the fixed probe scalar.
bech32 = "0.9"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
futures = "0.3" # block_on for the async endpoint tests
# `tests/library.rs` builds a file the way ikigai-layers' `at_rest.rs` does, with `age`
# called directly, and opens it with this crate's `age::open`. The same line the library
# takes; a dev-dependency adds no feature to a consumer's build.
age = { version = "0.11", default-features = false }
# The module recipe as one test (`tests/conformance.rs`): walks every bound endpoint and
# reports every violation at once, SPACE-NAME included (0.6.0) and REQUIRED (0.8.0). 0.9 adds
# core 0.1.105's contract-shape checks (REQUIRED probes input groups, OUTPUTS honors
# output_from, PIPELINE named-only line, VALIDATE refuses a default on a binding) and
# RECOMPUTE; 0.10 adds FAILURES, off unless a suite opts in. 0.11 is the core 0.2.0 line and
# turns FAILURES and DATATYPES on by default. 0.12 adds BODIES and BODY-INPUTS.
ikigai-conformance = "0.12.0"
