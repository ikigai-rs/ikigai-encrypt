name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    with:
      # The library face builds without the kernel (ledger #2016): a consumer taking
      # `default-features = false` must link neither ikigai-core nor async-trait.
      no-default-features: true
      no-default-features-forbid: "ikigai-core async-trait"
